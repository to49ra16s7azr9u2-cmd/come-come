# Render にボタン1つで公開するための設定(Blueprint)。
# ANTHROPIC_API_KEY と APP_ACCESS_CODE は作成時に Render の画面で入力する(このファイルには書かない)。
services:
  - type: web
    name: come-come
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --omit=dev && npm run fetch-model
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_ACCESS_CODE
        sync: false
      - key: DAILY_ANALYSIS_LIMIT
        value: "1500"
      # 利用者の写真を受け付けるときは、有料プランで永続ディスクをつなぎ、そのマウント先を CONTRIB_DIR に指定する
      # - key: CONTRIB_DIR
      #   value: /var/data/contrib
      - key: NODE_VERSION
        value: "22"

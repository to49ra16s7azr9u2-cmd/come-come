<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f4b8f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="come-come" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>come-come</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Maru+Gothic:wght@700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>come-come</h1>
      <p class="sub" data-i18n="tagline"></p>
    </div>
    <button id="settingsBtn" class="ghost" data-i18n="btn.settings"></button>
  </header>

  <main>
    <div id="sampleBanner" class="sample-banner" hidden>
      <span data-i18n="sample.banner"></span>
      <button id="clearSampleBtn" class="ghost small" data-i18n="btn.clearSample"></button>
    </div>

    <section class="camera card">
      <div class="video-wrap" id="videoWrap">
        <video id="video" playsinline muted></video>
        <canvas id="overlay" class="overlay"></canvas>
        <div id="placeholder" class="placeholder" data-i18n="btn.start"></div>
        <div id="liveDish" class="live-dish" aria-live="polite" hidden></div>
        <div class="live" id="live" hidden>
          <span id="liveState" class="live-state"></span>
          <span><span data-i18n="live.bites"></span> <strong id="liveBites">0</strong></span>
        </div>
      </div>
      <div class="controls">
        <button id="startBtn" class="primary" data-i18n="btn.start"></button>
        <button id="flipBtn" disabled data-i18n="btn.flip"></button>
        <button id="handsFreeBtn" disabled><span data-i18n="btn.handsfree"></span> <span class="premium-tag">PRO</span></button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
      <p class="muted small" data-i18n="tip.reference"></p>
    </section>

    <section class="card today">
      <div class="today-grid">
        <div>
          <h2 data-i18n="today.title"></h2>
          <div class="energy-num"><span id="kcal">0</span><small> / <span id="kcalTarget">0</span> kcal</small></div>
          <div class="meter"><div id="kcalBar" class="meter-fill"></div></div>
          <p id="kcalLeft" class="muted small"></p>
        </div>
        <div class="score" aria-live="polite">
          <div class="score-ring" id="scoreRing"><span id="score">0</span></div>
          <span class="muted small" data-i18n="today.score"></span>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 data-i18n="meals.title"></h2>
        <button id="newMealBtn" class="ghost" data-i18n="btn.split"></button>
      </div>
      <div id="meals" class="meals"></div>
    </section>

    <section class="card">
      <h2 data-i18n="nutrients.title"></h2>
      <ul id="nutrients" class="nutrients"></ul>
    </section>

    <section class="card">
      <h2 data-i18n="advice.title"></h2>
      <ul id="advice" class="advice"></ul>
    </section>

    <section class="card">
      <h2 data-i18n="weight.title"></h2>
      <form id="weightForm" class="weight-form">
        <input id="weightInput" type="number" inputmode="decimal" step="0.1" min="20" max="300" data-i18n-placeholder="weight.placeholder" />
        <button class="primary" data-i18n="btn.recordWeight"></button>
      </form>
      <p id="bmi" class="muted small"></p>
      <div id="weightChart" class="weight-chart"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 data-i18n="history.title"></h2>
        <button id="resetBtn" class="ghost danger small" data-i18n="btn.reset"></button>
      </div>
      <ul id="history" class="history"></ul>
    </section>

    <p class="disclaimer" data-i18n="disclaimer"></p>
  </main>

  <dialog id="profileDialog">
    <form id="profileForm" method="dialog">
      <h2 id="profileTitle"></h2>
      <p id="profileIntro" class="muted small" data-i18n="profile.intro"></p>
      <div class="form-grid">
        <label><span data-i18n="profile.lang"></span><select id="pfLang" name="lang"></select></label>
        <label><span data-i18n="profile.sex"></span>
          <select id="pfSex" name="sex"><option value="female" data-i18n="profile.female"></option><option value="male" data-i18n="profile.male"></option></select>
        </label>
        <label><span data-i18n="profile.age"></span><input id="pfAge" name="age" type="number" min="15" max="100" required /></label>
        <label><span data-i18n="profile.height"></span><input id="pfHeight" name="height_cm" type="number" min="100" max="230" step="0.1" required /></label>
        <label><span data-i18n="profile.weight"></span><input id="pfWeight" name="weight_kg" type="number" min="25" max="300" step="0.1" required /></label>
        <label><span data-i18n="profile.targetWeight"></span><input id="pfTarget" name="target_weight_kg" type="number" min="25" max="300" step="0.1" /></label>
        <label class="wide"><span data-i18n="profile.activity"></span><select id="pfActivity" name="activity"></select></label>
        <label><span data-i18n="profile.goal"></span><select id="pfGoal" name="goal"></select></label>
        <label><span data-i18n="profile.country"></span><select id="pfCountry" name="country"></select></label>
        <label class="wide"><span data-i18n="profile.state"></span><select id="pfState" name="state"></select></label>
        <label class="wide"><span data-i18n="profile.plate"></span><input id="pfPlate" name="plate_cm" type="number" min="0" max="60" step="0.5" /></label>
        <label class="wide"><span data-i18n="profile.analysis"></span><select id="pfAnalysis" name="analysis"></select></label>
        <label class="wide"><span data-i18n="profile.plan"></span><select id="pfPlan" name="plan"></select></label>
        <div class="wide contrib-row" id="contribRow" hidden>
          <label class="check"><input type="checkbox" id="pfContribute" name="contribute" /> <span data-i18n="contrib.setting"></span></label>
          <p class="muted small"><span data-i18n="contrib.settingHint"></span> <a href="privacy.html" target="_blank" rel="noopener" data-i18n="contrib.privacy"></a></p>
          <button type="button" id="deleteContribBtn" class="ghost small danger" data-i18n="contrib.delete"></button>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="profileCancel" value="cancel" class="ghost" formnovalidate data-i18n="btn.cancel"></button>
        <button value="save" class="primary" data-i18n="btn.save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="addDialog">
    <form id="addForm" method="dialog">
      <h2 id="addTitle" data-i18n="add.title"></h2>
      <input id="addSearch" type="search" autocomplete="off" data-i18n-placeholder="add.search" />
      <ul id="addResults" class="add-results"></ul>
      <div class="form-grid">
        <label id="addGramsLabel"><span data-i18n="add.grams"></span><input id="addGrams" type="number" min="1" max="3000" /></label>
        <label><span data-i18n="add.meal"></span><select id="addMeal"></select></label>
      </div>
      <div class="dialog-actions">
        <button value="cancel" class="ghost" formnovalidate data-i18n="btn.cancel"></button>
        <button id="addSubmit" value="add" class="primary" disabled data-i18n="btn.add"></button>
      </div>
    </form>
  </dialog>

  <dialog id="consentDialog">
    <form method="dialog">
      <h2 data-i18n="contrib.title"></h2>
      <p data-i18n="contrib.body"></p>
      <ul class="consent-list small">
        <li data-i18n="contrib.what"></li>
        <li data-i18n="contrib.notWhat"></li>
        <li data-i18n="contrib.revoke"></li>
      </ul>
      <p class="small"><a href="privacy.html" target="_blank" rel="noopener" data-i18n="contrib.privacy"></a></p>
      <div class="dialog-actions">
        <button value="no" class="ghost" data-i18n="contrib.no"></button>
        <button value="yes" class="primary" data-i18n="contrib.yes"></button>
      </div>
    </form>
  </dialog>

  <dialog id="premiumDialog">
    <form method="dialog">
      <h2 data-i18n="premium.title"></h2>
      <p data-i18n="premium.body"></p>
      <p class="muted small" data-i18n="premium.note"></p>
      <div class="dialog-actions">
        <button value="cancel" class="ghost" data-i18n="btn.close"></button>
        <button value="trial" class="primary" data-i18n="btn.startTrial"></button>
      </div>
    </form>
  </dialog>

  <dialog id="accessDialog">
    <form id="accessForm" method="dialog">
      <h2 data-i18n="access.title"></h2>
      <p id="accessBody" class="muted small" data-i18n="access.body"></p>
      <input id="accessInput" type="password" autocomplete="current-password" required data-i18n-placeholder="access.placeholder" />
      <div class="dialog-actions">
        <button value="cancel" class="ghost" formnovalidate data-i18n="btn.cancel"></button>
        <button value="save" class="primary" data-i18n="btn.save"></button>
      </div>
    </form>
  </dialog>

  <div id="handsFree" class="hands-free" hidden>
    <div class="hf-kcal"><span id="hfKcal">0</span> kcal</div>
    <div id="hfStatus" class="hf-status"></div>
    <div class="hf-hint" data-i18n="handsfree.hint"></div>
  </div>

  <canvas id="canvas" hidden></canvas>
  <script type="module" src="app.js"></script>
</body>
</html>
